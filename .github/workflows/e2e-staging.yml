name: E2E Staging — PRC mold

# Live platform-testing MCP. Mirrors Frontend e2e-automation: scheduled/manual,
# not a PR gate. ci.yml pytest covers the harness contract on every PR.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      STAGING_E2E: "1"
      MCP_STAGING_URL: https://api-platform-testing.solsticehealth.co/mcp
      STAGING_TENANT: platform_testing
      STAGING_PROJECT_ID: 92cfc1cd-0e3c-4b20-bde0-71aa2d489e68
      MCP_CI_AUTH0_TOKEN_URL: https://login-solstice.us.auth0.com/oauth/token
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Mint or load MCP token
        id: token
        env:
          MCP_STAGING_TOKEN: ${{ secrets.MCP_STAGING_TOKEN }}
          MCP_CI_AUTH0_CLIENT_ID: ${{ secrets.MCP_CI_AUTH0_CLIENT_ID }}
          MCP_CI_AUTH0_CLIENT_SECRET: ${{ secrets.MCP_CI_AUTH0_CLIENT_SECRET }}
        run: |
          if [ -n "$MCP_STAGING_TOKEN" ]; then
            echo "::add-mask::$MCP_STAGING_TOKEN"
            echo "token=$MCP_STAGING_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$MCP_CI_AUTH0_CLIENT_ID" ] || [ -z "$MCP_CI_AUTH0_CLIENT_SECRET" ]; then
            echo "No MCP_STAGING_TOKEN or M2M client; skipping live E2E"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOKEN=$(curl --fail --silent --show-error -X POST "$MCP_CI_AUTH0_TOKEN_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc \
              --arg id "$MCP_CI_AUTH0_CLIENT_ID" \
              --arg secret "$MCP_CI_AUTH0_CLIENT_SECRET" \
              --arg aud "$MCP_STAGING_URL" \
              '{client_id:$id, client_secret:$secret, audience:$aud, grant_type:"client_credentials", scope:"mcp:connect"}')" \
            | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "Auth0 returned no access_token" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Run staging PRC coverage
        if: steps.token.outputs.skip != 'true'
        env:
          MCP_STAGING_TOKEN: ${{ steps.token.outputs.token }}
        run: pytest tests/e2e/test_staging_prc_coverage.py
